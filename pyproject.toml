[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fmnist"
version = "1.0.0"
description = "Fashion-MNIST image classification: softmax regression vs MLP vs CNN in PyTorch"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["torch>=2.3", "numpy>=1.26", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
track = ["mlflow>=3.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]
